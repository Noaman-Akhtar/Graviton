<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graviton</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="main-menu">
    <h1 class="game-title">GRAVITON</h1>
    <div class="ship-selector">
      <button id="prev-ship" class="nav-btn" type="button">◀</button>
      <div id="ship-display">
        <div class="ship-preview-aura"></div>
        <div class="ship-preview-body"></div>
        <div class="ship-preview-highlight"></div>
        <div class="ship-preview-engine"></div>
      </div>
      <button id="next-ship" class="nav-btn" type="button">▶</button>
    </div>
    <button id="play-btn" class="menu-btn" type="button">PLAY</button>
  </div>
  <div id="game-over-menu" class="overlay-panel hidden">
    <h2 class="overlay-title">GAME OVER</h2>
    <div class="overlay-score">Score: <span id="final-score">0</span></div>
    <div class="overlay-score">Best: <span id="final-best">0</span></div>
    <div class="overlay-actions">
      <button id="restart-btn" class="menu-btn overlay-btn" type="button">RESTART</button>
      <button id="back-menu-btn" class="alt-btn" type="button">MAIN MENU</button>
    </div>
  </div>
  <canvas id="game"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
